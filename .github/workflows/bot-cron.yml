name: Bot Sastra Fadrodzak Cron (Setiap 3 Jam)

on:
  schedule:
    # Berjalan setiap 3 jam sekali (menit ke-15 untuk menghindari kepadatan antrean runner GitHub pada menit ke-00)
    - cron: '15 */3 * * *'
  # Tombol jalankan manual langsung dari tab Actions di GitHub
  workflow_dispatch:
  # Tes otomatis saat file bot atau workflow diperbarui
  push:
    paths:
      - 'bot_sastra_cron.js'
      - '.github/workflows/bot-cron.yml'

jobs:
  upload-karya:
    name: Unggah Karya Sastra Otomatis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan Bot Sastra
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://fadrodzak.my.id' }}
        run: node bot_sastra_cron.js
